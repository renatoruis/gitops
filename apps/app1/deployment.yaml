# deployment.yaml for nginx alpine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-alpine
  namespace: default
  labels:
    app: nginx-alpine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-alpine
  template:
    metadata:
      labels:
        app: nginx-alpine
    spec:
      containers:
        - name: nginx-alpine
          image: ealen/echo-server
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m